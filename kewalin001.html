<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บัตรประจำตัว — 花</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@300;400;600;700&family=Noto+Sans+Thai:wght@300;400;500&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:      #f1efe8;
    --card:       #faf9f5;
    --ink-deep:   #1c1b19;
    --ink:        #3a3936;
    --ink-mid:    #6b6a65;
    --ink-mist:   #a6a49a;
    --line:       #ddd9cd;
    --seal:       #9c3b2e;
    --serif: 'Noto Serif Thai', serif;
    --sans:  'Noto Sans Thai', sans-serif;
    --brush: 'Ma Shan Zheng', cursive;
  }
 
  *{ box-sizing:border-box; margin:0; padding:0; }
 
  body{
    min-height:100vh;
    background:var(--paper);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
    position:relative;
    overflow-x:hidden;
  }
 
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:.04;
    background-image:
      radial-gradient(circle at 20% 30%, #000 0, transparent 1px),
      radial-gradient(circle at 70% 60%, #000 0, transparent 1px);
    background-size: 3px 3px, 4px 4px;
  }
 
  /* faint corner ink wash */
  body::after{
    content:"";
    position:fixed;
    right:-120px; bottom:-120px;
    width:420px; height:420px;
    background:radial-gradient(circle, rgba(28,27,25,.05) 0%, transparent 70%);
    pointer-events:none;
  }
 
  .card{
    position:relative;
    width:100%;
    max-width:400px;
    background:var(--card);
    border-radius:14px;
    overflow:hidden;
    box-shadow:
      0 1px 2px rgba(20,19,17,.06),
      0 18px 40px -18px rgba(20,19,17,.28);
    border:1px solid var(--line);
  }
 
  /* ---------- header ---------- */
 
  .card-header{
    position:relative;
    height:150px;
    background:#0f0e0d;
    display:flex;
    align-items:flex-start;
    justify-content:flex-end;
    padding:14px 18px 0 0;
  }
 
  .card-header img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center 30%;
    filter:grayscale(1) contrast(1.05);
    opacity:.85;
  }
 
  .card-header::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,10,9,.15) 0%, rgba(10,10,9,.55) 100%);
  }
 
  .card-mark{
    position:relative;
    z-index:2;
    font-family:var(--brush);
    font-size:1.5rem;
    color:#e8e5da;
    opacity:.85;
  }
 
  /* ---------- avatar ---------- */
 
  .avatar-wrap{
    position:relative;
    z-index:3;
    display:flex;
    justify-content:center;
    margin-top:-46px;
  }
 
  .avatar{
    width:92px; height:92px;
    border-radius:50%;
    background:var(--ink-deep);
    border:4px solid var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 16px rgba(20,19,17,.25);
  }
 
  .avatar span{
    font-family:var(--brush);
    font-size:2.1rem;
    color:var(--paper);
  }
 
  /* ---------- identity ---------- */
 
  .identity{
    text-align:center;
    padding:12px 24px 22px;
  }
 
  .name{
    font-family:var(--serif);
    font-weight:700;
    font-size:1.35rem;
    color:var(--ink-deep);
    letter-spacing:.2px;
  }
 
  .role{
    margin-top:5px;
    font-size:.85rem;
    color:var(--ink-mid);
    font-weight:400;
  }
 
  /* ---------- divider ---------- */
 
  .divider{
    display:flex;
    justify-content:center;
    padding:0 24px 6px;
  }
  .divider svg{ width:160px; height:14px; opacity:.4; }
 
  /* ---------- info rows ---------- */
 
  .info{
    padding:6px 26px 22px;
  }
 
  .info-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding:13px 0;
    border-top:1px solid var(--line);
  }
 
  .info-label{
    font-size:.82rem;
    color:var(--ink-mist);
    white-space:nowrap;
  }
 
  .info-value{
    font-size:.9rem;
    color:var(--ink-deep);
    font-weight:500;
    text-align:right;
    word-break:break-word;
  }
 
  /* ---------- skills ---------- */
 
  .skills-block{
    padding-top:14px;
    border-top:1px solid var(--line);
  }
 
  .skills-label{
    font-size:.82rem;
    color:var(--ink-mist);
    margin-bottom:10px;
  }
 
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
 
  .tag{
    font-family:var(--serif);
    font-size:.78rem;
    color:var(--ink-deep);
    background:transparent;
    border:1px solid var(--ink-mid);
    border-radius:999px;
    padding:5px 13px;
  }
 
  /* ---------- seal ---------- */
 
  .seal{
    position:absolute;
    top:12px; left:14px;
    z-index:3;
    width:34px; height:34px;
    border:1.5px solid var(--seal);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--seal);
    font-family:var(--brush);
    font-size:1rem;
    background:rgba(241,239,232,.08);
    transform:rotate(-3deg);
    opacity:.9;
  }
 
  @media (max-width:420px){
    .card{ max-width:100%; }
  }
 
  :focus-visible{ outline:2px solid var(--seal); outline-offset:3px; }
</style>
</head>
