<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Raymi | Links</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(168, 85, 247, 0.20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 85%,
                    rgba(126, 34, 206, 0.20),
                    transparent 30%
                ),
                #050308;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;

            overflow-x: hidden;
        }


        /* =========================================
           BACKGROUND ANIMATION
        ========================================= */

        body::before {
            content: "";

            position: fixed;

            width: 420px;
            height: 420px;

            top: -180px;
            left: -150px;

            border-radius: 50%;

            background: #8b5cf6;

            filter: blur(150px);

            opacity: 0.13;

            pointer-events: none;

            animation: backgroundMove 9s ease-in-out infinite alternate;
        }


        body::after {
            content: "";

            position: fixed;

            width: 380px;
            height: 380px;

            right: -150px;
            bottom: -150px;

            border-radius: 50%;

            background: #a855f7;

            filter: blur(150px);

            opacity: 0.10;

            pointer-events: none;

            animation: backgroundMove2 11s ease-in-out infinite alternate;
        }


        @keyframes backgroundMove {

            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(180px, 130px);
            }

        }


        @keyframes backgroundMove2 {

            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(-170px, -120px);
            }

        }


        /* =========================================
           PROFILE BOX
        ========================================= */

        .profile {

            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 430px;

            background: rgba(15, 10, 22, 0.92);

            border: 1px solid #3b2055;

            border-radius: 25px;

            padding: 30px 25px;

            text-align: center;

            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.65),
                0 0 40px rgba(168, 85, 247, 0.12);

            backdrop-filter: blur(15px);
        }


        /* =========================================
           PROFILE IMAGE
        ========================================= */

        .image-box {

            position: relative;

            width: 120px;
            height: 120px;

            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

        }


        .profile-image {

            width: 105px;
            height: 105px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid #a855f7;

            position: relative;

            z-index: 2;

            box-shadow:
                0 0 15px rgba(168, 85, 247, 0.5),
                0 0 35px rgba(168, 85, 247, 0.25);

            transition: 0.4s ease;

        }


        /* Glow ตอน Hover รูป */

        .image-box:hover .profile-image {

            transform: scale(1.05);

            box-shadow:
                0 0 20px rgba(168, 85, 247, 0.8),
                0 0 50px rgba(168, 85, 247, 0.45);

        }


        /* วงแหวนหมุน */

        .image-box::before {

            content: "";

            position: absolute;

            width: 116px;
            height: 116px;

            border-radius: 50%;

            border: 2px solid transparent;

            border-top-color: #c084fc;
            border-right-color: #7e22ce;

            animation:
                rotateRing 4s linear infinite;

        }


        /* วงแหวนอีกชั้น */

        .image-box::after {

            content: "";

            position: absolute;

            width: 111px;
            height: 111px;

            border-radius: 50%;

            border: 1px solid rgba(168, 85, 247, 0.25);

            animation:
                pulseRing 2.5s ease-in-out infinite;

        }


        @keyframes rotateRing {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        @keyframes pulseRing {

            0%,
            100% {
                transform: scale(0.95);
                opacity: 0.4;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }

        }


        /* =========================================
           NAME
        ========================================= */

        .name {

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 5px;

            letter-spacing: 0.5px;

        }


        .username {

            color: #a855f7;

            font-size: 14px;

            margin-bottom: 12px;

        }


        /* =========================================
           BIO
        ========================================= */

        .bio {

            color: #aaa3b3;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 25px;

        }


        /* =========================================
           INFO
        ========================================= */

        .info {

            background: rgba(11, 7, 16, 0.9);

            border: 1px solid #291738;

            border-radius: 15px;

            padding: 15px;

            margin-bottom: 20px;

            text-align: left;

            transition: 0.3s ease;

        }


        .info:hover {

            border-color: #5b2a7d;

            box-shadow:
                0 0 20px rgba(168, 85, 247, 0.08);

        }


        .info-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            padding: 8px 0;

            border-bottom: 1px solid #1d1227;

            font-size: 13px;

        }


        .info-row:last-child {
            border-bottom: none;
        }


        .info-title {
            color: #8e8795;
        }


        .info-value {

            color: #ddd6e4;

            text-align: right;

        }


        /* =========================================
           LINKS
        ========================================= */

        .links {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .link {

            position: relative;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            width: 100%;

            padding: 15px;

            border-radius: 13px;

            text-decoration: none;

            color: white;

            font-weight: bold;

            background: #17101f;

            border: 1px solid #382049;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;

        }


        /* แสงวิ่งผ่านปุ่ม */

        .link::before {

            content: "";

            position: absolute;

            top: -30%;

            left: -120px;

            width: 70px;

            height: 160%;

            background: rgba(255, 255, 255, 0.10);

            transform: rotate(25deg);

            transition: 0.55s ease;

        }


        .link:hover::before {

            left: 120%;

        }


        /* Hover */

        .link:hover {

            transform:
                translateY(-4px)
                scale(1.015);

            background: #241333;

            border-color: #a855f7;

            box-shadow:
                0 8px 25px rgba(168, 85, 247, 0.20);

        }


        /* ตอนกด */

        .link:active {

            transform:
                translateY(0)
                scale(0.96);

        }


        /* =========================================
           DONATE
        ========================================= */

        .donate {

            background:
                linear-gradient(
                    135deg,
                    #7e22ce,
                    #a855f7
                );

            border: none;

            animation:
                donateGlow 2.5s ease-in-out infinite;

        }


        @keyframes donateGlow {

            0%,
            100% {

                box-shadow:
                    0 0 8px rgba(168, 85, 247, 0.20);

            }

            50% {

                box-shadow:
                    0 0 25px rgba(168, 85, 247, 0.50);

            }

        }


        .donate:hover {

            background:
                linear-gradient(
                    135deg,
                    #9333ea,
                    #c084fc
                );

            box-shadow:
                0 10px 35px rgba(168, 85, 247, 0.45);

        }


        /* =========================================
           TAGS
        ========================================= */

        .tags {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 7px;

            margin-top: 20px;

        }


        .tag {

            background: #17101f;

            color: #c084fc;

            border: 1px solid #39204c;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 11px;

            transition:
                0.25s ease;

        }


        .tag:hover {

            color: white;

            background: #2a1539;

            border-color: #a855f7;

            transform:
                translateY(-3px)
                scale(1.05);

            box-shadow:
                0 5px 15px rgba(168, 85, 247, 0.15);

        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            color: #665e6d;

            font-size: 11px;

            margin-top: 25px;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            body {

                padding: 15px;

            }


            .profile {

                padding: 25px 18px;

                border-radius: 22px;

            }


            .name {

                font-size: 25px;

            }


            .profile-image {

                width: 100px;
                height: 100px;

            }


            .image-box {

                width: 115px;
                height: 115px;

            }


            .image-box::before {

                width: 111px;
                height: 111px;

            }


            .image-box::after {

                width: 106px;
                height: 106px;

            }

        }

    </style>

</head>
