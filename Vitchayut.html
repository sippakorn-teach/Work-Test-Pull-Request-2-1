<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitchayut Bootlee</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* กล่อง Profile Card หลัก */
        .profile-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* ส่วนหัวสีน้ำเงินด้านบน */
        .profile-header {
            background: linear-gradient(135deg, #a04ada, #a578cfe3, #d089e5);
            color: white;
            text-align: center;
            padding: 40px 20px 30px 20px;
            position: relative;
        }

        /* รูปภาพโปรไฟล์ทรงกลม */
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.8);
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .profile-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .profile-title {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }

        /* ส่วนแสดงข้อมูลรายละเอียดด้านล่าง */
        .profile-body {
            padding: 30px 24px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-row:last-of-type {
            border-bottom: none;
        }

        .info-label {
            color: #666;
            font-size: 14px;
            font-weight: 600;
        }

        .info-value {
            color: #333;
            font-size: 14px;
            text-align: right;
        }

        /* ส่วนแสดงทักษะความสามารถ (Skills / Tags) */
        .skills-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .skills-title {
            color: #666;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .skills-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .skill-tag {
            background-color: #eef2ff;
            color: #3b82f6;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #dbeafe;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- ส่วนหัว (รูปภาพโปรไฟล์ + coco) -->
        <div class="profile-header">
            <!-- 💡 อย่าลืมเปลี่ยนชื่อไฟล์รูปภาพตรง src="avatar.jpg" ให้ตรงกับไฟล์รูปจริงของคุณนะครับ -->
            <img src="coco.jpeg" alt="Profile Picture" class="profile-img">
            <div class="profile-name">วิชยุตม์  บุตรหลี</div>
            <div class="profile-title">ตำแหน่ง: นักเรียน</div>
        </div>

        <!-- ส่วนตารางรายละเอียดข้อมูล -->
        <div class="profile-body">
            <div class="info-row">
                <span class="info-label">รหัสนักศึกษา:</span>
                <span class="info-row-value info-value">68219010014</span>
            </div>
            
            <div class="info-row">
                <span class="info-label">อีเมล:</span>
                <span class="info-value">68219010014@kbtc.ac.th</span>
            </div>
            
            <div class="info-row">
                <span class="info-label">แผนก / สาขา:</span>
                <span class="info-value">เทคโนโลยีสารสนเทศ</span>
            </div>

            <!-- ส่วนแท็กความสามารถด้านล่างสุด -->
            <div class="skills-section">
                <div class="skills-title">ทักษะความสามารถ:</div>
                <div class="skills-container">
                    <span class="skill-tag">กล้าแสดง</span>
                    <span class="skill-tag">เข้าสังคม</span>
                    <span class="skill-tag">พูดเก่ง</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
